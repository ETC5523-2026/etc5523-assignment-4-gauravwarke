url: https://etc5523-2026.github.io/etc5523-assignment-4-gauravwarke/

destination: docs

template:
  bootstrap: 5
  bslib:
    bg: "#F6F3EB"
    fg: "#1E2421"
    primary: "#1F4D3F"
    link-color: "#A0521A"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Merriweather"}

